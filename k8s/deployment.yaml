apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashion-ai-api
  labels:
    app: fashion-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fashion-ai
  template:
    metadata:
      labels:
        app: fashion-ai
    spec:
      containers:
        - name: fastapi-server
          image: fashion-ai-assistant:latest
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "16Gi"
            requests:
              memory: "8Gi"
              cpu: "2"
          env:
            - name: REDIS_HOST
              value: "redis-service"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fashion-ai-service
spec:
  selector:
    app: fashion-ai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
